<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revora Voice AI — Portfolio Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#08131d;color:#eef5fa;font:17px Arial,sans-serif}.shell{display:grid;grid-template-columns:245px 1fr;min-height:900px}.side{background:#0d202d;padding:38px 25px;border-right:1px solid #234050}.brand{font-size:28px;font-weight:bold;color:#4be0d0}.sub{font-size:13px;color:#91adbf;margin:12px 0 46px}.nav{display:block;text-decoration:none;color:#a9c1cf;padding:16px 12px;margin:8px 0;border-radius:10px}.nav.active{background:#173f4b;color:#65ead8}.main{padding:42px 55px}.top{display:flex;justify-content:space-between;font-size:13px;letter-spacing:2px;color:#85a9ba}.pill{border:1px solid #a38b48;border-radius:20px;padding:9px 17px;color:#e9ca7e}h1{font-size:44px;margin:55px 0 17px}p{color:#a9c1cf;line-height:1.6}.cards{margin-top:35px;display:grid;gap:14px}.card{background:#102735;border:1px solid #254354;border-radius:15px;padding:23px 28px;display:grid;grid-template-columns:215px 1fr;gap:24px;align-items:center}.label{font-size:14px;color:#78b4c6}.value{font-size:20px}.footer{margin-top:35px;padding:20px;border-left:3px solid #d5b466;color:#a9c1cf;font-size:14px}.count{color:#42d7c4;font-size:13px;letter-spacing:3px;margin-top:32px}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:20px}.sub{margin:10px}.nav{display:inline-block;font-size:12px}.main{padding:25px}.card{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">Revora<span style="color:#d9bc75"> AI</span></div><div class="sub">VICTORIA / VOICE WORKFLOW</div><nav id="nav"></nav></aside><main class="main"><div class="top"><span>PROJECT 03 / APPLIED AI</span><span class="pill">SYNTHETIC PORTFOLIO DEMO</span></div><div class="count" id="count"></div><h1 id="title"></h1><p id="desc"></p><div id="cards" class="cards"></div><div class="footer">Illustrative interface using synthetic data. This demo does not place calls, send messages, book meetings, or connect to Vapi.</div></main></div><script>const views=[["01-agent-overview", "Agent overview", "A voice workflow built around the next useful action.", [["Agent", "Victoria \u00b7 Revora AI"], ["Test mode", "Browser voice conversation"], ["Conversation style", "Brief introduction \u00b7 listen \u00b7 clarify"], ["Core workflow", "Route \u2192 qualify \u2192 capture \u2192 review"]]], ["02-conversation-flow", "Conversation flow", "Short turns. Clear questions. Respectful exits.", [["Introduce", "Identify Revora and explain the purpose"], ["Listen", "Stop speaking when the person interjects"], ["Understand", "Ask about the work and AI familiarity"], ["Respond", "Explain relevant capabilities without promises"], ["Close", "Confirm an agreed next step or end politely"]]], ["03-receptionist-routing", "Receptionist routing", "Find the appropriate person without pressuring the front desk.", [["Receptionist", "Who handles this kind of request?"], ["Route supplied", "Operations team \u00b7 synthetic example"], ["Transfer status", "Offered \u2014 completion not verified"], ["Fallback", "Accept an authorized business contact channel"]]], ["04-lead-qualification", "Lead qualification", "Capture what the prospect actually says.", [["Company", "Example Manufacturing \u00b7 synthetic"], ["Challenge", "Manual scheduling takes too much time"], ["AI familiarity", "Beginner \u00b7 self-described"], ["Interest", "Asked about scheduling assistance"], ["Meeting", "Requested \u00b7 not booked"]]], ["05-structured-call-record", "Structured call record", "Convert the conversation into a factual review record.", [["callOutcome", "informationRequested"], ["permissionToEmail", "explicitYes"], ["meetingStatus", "notBooked"], ["doNotContact", "notMentioned"], ["nextAction", "Human review before sending requested information"]]], ["06-follow-up-review", "Follow-up review", "Keep proposed actions separate from completed actions.", [["Review record", "Verify transcript and contact details"], ["Follow-up preference", "Only use the explicitly agreed channel"], ["Opt-out", "Route suppression request for immediate action"], ["CRM sync", "Planned integration \u00b7 not implemented"], ["Scheduling", "Planned tool \u00b7 no booking claimed"]]]];function render(){const i=Math.max(0,Math.min(5,Number(location.hash.slice(1))||0));document.querySelector('#nav').innerHTML=views.map((v,j)=>`<a class="nav ${i===j?'active':''}" href="#${j}">${String(j+1).padStart(2,'0')} &nbsp; ${v[1]}</a>`).join('');document.querySelector('#count').textContent=`WORKFLOW VIEW ${i+1} / 6`;document.querySelector('#title').textContent=views[i][1];document.querySelector('#desc').textContent=views[i][2];document.querySelector('#cards').innerHTML=views[i][3].map(r=>`<div class="card"><div class="label">${r[0]}</div><div class="value">${r[1]}</div></div>`).join('')}window.addEventListener('hashchange',render);render();</script></body></html>
